<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Dizionario dei Sinonimi - Edizione vintage restaurata digitalmente">
    <meta name="theme-color" content="#D97706">
    <title>Dizionario dei Sinonimi</title>
    
    <link rel="manifest" href="manifest.json">
    <link rel="icon" type="image/png" href="icon-192.png">
    <link rel="apple-touch-icon" href="icon-192.png">
    <script>
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.register('./sw.js').catch(() => {});
      }
    </script>
    
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="Sinonimi">
    
    <script crossorigin src="./vendor/react.production.min.js"></script>
    <script crossorigin src="./vendor/react-dom.production.min.js"></script>
    <!-- FIX #2: Tailwind pinnato alla versione specifica -->
    <script src="./vendor/tailwind-3.4.1.js"></script>
    <!-- FIX #1: Babel RIMOSSO - JSX pre-transpilato -->
    <style>
        body { margin: 0; padding: 0; }
        .install-prompt {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: linear-gradient(to right, #059669, #10b981);
            color: white;
            padding: 16px 24px;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
            z-index: 1000;
            animation: slideUp 0.3s ease-out;
        }
        @keyframes slideUp {
            from { transform: translateX(-50%) translateY(100px); opacity: 0; }
            to { transform: translateX(-50%) translateY(0); opacity: 1; }
        }
        .highlight {
            background-color: #FEF3C7;
            border-radius: 2px;
            padding: 0 2px;
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script>
    // Attende che React sia caricato dai CDN
    function initApp() {
        const { useState, useRef, useEffect, useCallback, useMemo } = React;
        const e = React.createElement;

        // Debounce hook
        const useDebounce = (callback, delay) => {
            const timeoutRef = useRef(null);
            return useCallback((...args) => {
                if (timeoutRef.current) clearTimeout(timeoutRef.current);
                timeoutRef.current = setTimeout(() => callback(...args), delay);
            }, [callback, delay]);
        };

        // Normalizza testo (rimuove accenti per ricerca)
        const normalizeText = (text) => {
            return text.normalize("NFD").replace(/[\u0300-\u036f]/g, "").toLowerCase();
        };

        // --- SVG Icons as functions ---
        const SearchIcon = () => e('svg', { width: 20, height: 20, viewBox: '0 0 24 24', fill: 'none', stroke: 'currentColor', strokeWidth: 2 },
            e('circle', { cx: 11, cy: 11, r: 8 }),
            e('path', { d: 'm21 21-4.35-4.35' })
        );

        const UploadIcon = ({ size = 20 }) => e('svg', { width: size, height: size, viewBox: '0 0 24 24', fill: 'none', stroke: 'currentColor', strokeWidth: 2 },
            e('path', { d: 'M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4' }),
            e('polyline', { points: '17 8 12 3 7 8' }),
            e('line', { x1: 12, y1: 3, x2: 12, y2: 15 })
        );

        const DownloadIcon = ({ size = 20 }) => e('svg', { width: size, height: size, viewBox: '0 0 24 24', fill: 'none', stroke: 'currentColor', strokeWidth: 2 },
            e('path', { d: 'M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4' }),
            e('polyline', { points: '7 10 12 15 17 10' }),
            e('line', { x1: 12, y1: 15, x2: 12, y2: 3 })
        );

        const TrashIcon = ({ size = 20 }) => e('svg', { width: size, height: size, viewBox: '0 0 24 24', fill: 'none', stroke: 'currentColor', strokeWidth: 2 },
            e('polyline', { points: '3 6 5 6 21 6' }),
            e('path', { d: 'M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2' })
        );

        const BookOpenIcon = ({ size = 64 }) => e('svg', { width: size, height: size, viewBox: '0 0 24 24', fill: 'none', stroke: 'currentColor', strokeWidth: 2 },
            e('path', { d: 'M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z' }),
            e('path', { d: 'M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z' })
        );

        // FIX #5: Highlight robusto con regex, gestisce correttamente NFD
        const highlightText = (text, searchTerm, shouldHighlight) => {
            if (!searchTerm || !shouldHighlight) return text;
            
            const normalizedText = normalizeText(text);
            const normalizedTerm = normalizeText(searchTerm);
            
            // Trova la posizione nel testo normalizzato
            const idx = normalizedText.indexOf(normalizedTerm);
            if (idx === -1) return text;
            
            // Mappa indici dal testo normalizzato al testo originale
            // Ricostruiamo la mappatura carattere per carattere
            const original = text;
            const decomposed = text.normalize("NFD");
            
            // Mappa: per ogni char nel testo stripped (senza accenti), quale range nel testo originale?
            const mapToOriginal = [];
            let origIdx = 0;
            let decompIdx = 0;
            
            while (decompIdx < decomposed.length) {
                const ch = decomposed[decompIdx];
                // È un combining mark? (U+0300 - U+036F)
                if (/[\u0300-\u036f]/.test(ch)) {
                    decompIdx++;
                    continue;
                }
                // Questo carattere base corrisponde a un char nel testo stripped
                // Trova quanti bytes occupa nel testo originale (char base + eventuali combining)
                let endDecomp = decompIdx + 1;
                while (endDecomp < decomposed.length && /[\u0300-\u036f]/.test(decomposed[endDecomp])) {
                    endDecomp++;
                }
                // Il segmento decomposed[decompIdx..endDecomp] corrisponde a un singolo char originale
                // Ricomponi per trovare la lunghezza originale
                const segment = decomposed.slice(decompIdx, endDecomp).normalize("NFC");
                mapToOriginal.push({ strippedIdx: mapToOriginal.length, origStart: origIdx, origLen: segment.length });
                origIdx += segment.length;
                decompIdx = endDecomp;
            }
            
            // Ora idx e normalizedTerm.length sono in coordinate "stripped"
            if (idx >= mapToOriginal.length) return text;
            const endStripped = Math.min(idx + normalizedTerm.length - 1, mapToOriginal.length - 1);
            
            const origStart = mapToOriginal[idx].origStart;
            const lastEntry = mapToOriginal[endStripped];
            const origEnd = lastEntry.origStart + lastEntry.origLen;
            
            const before = original.slice(0, origStart);
            const match = original.slice(origStart, origEnd);
            const after = original.slice(origEnd);
            
            return e(React.Fragment, null,
                before,
                e('span', { className: 'highlight' }, match),
                after
            );
        };

        function SinonimiApp() {
            const [lemmi, setLemmi] = useState([]);
            const [searchTerm, setSearchTerm] = useState('');
            const [filtered, setFiltered] = useState([]);
            const [loading, setLoading] = useState(true);
            const [showExport, setShowExport] = useState(false);
            const [searchInSynonyms, setSearchInSynonyms] = useState(false);
            const [showInstallPrompt, setShowInstallPrompt] = useState(false);
            const [deferredPrompt, setDeferredPrompt] = useState(null);
            const [currentSearchTerm, setCurrentSearchTerm] = useState('');
            // FIX #3: stato per "carica altri"
            const [visibleCount, setVisibleCount] = useState(100);
            const fileInputRef = useRef(null);
            const jsonInputRef = useRef(null);

            const VERSION = '1.2.0';
            const CACHE_KEY = 'sinonimi-dizionario';
            const VERSION_KEY = 'sinonimi-version';

            // FIX #4: useMemo per dimensione JSON (no ricalcolo ad ogni render)
            const jsonSizeMB = useMemo(() => {
                if (lemmi.length === 0) return '0.00';
                return (JSON.stringify(lemmi).length / 1024 / 1024).toFixed(2);
            }, [lemmi]);

            useEffect(() => {
                const handleBeforeInstallPrompt = (ev) => {
                    ev.preventDefault();
                    setDeferredPrompt(ev);
                    setShowInstallPrompt(true);
                };
                window.addEventListener('beforeinstallprompt', handleBeforeInstallPrompt);
                return () => window.removeEventListener('beforeinstallprompt', handleBeforeInstallPrompt);
            }, []);

            const handleInstallClick = async () => {
                if (!deferredPrompt) return;
                deferredPrompt.prompt();
                await deferredPrompt.userChoice;
                setDeferredPrompt(null);
                setShowInstallPrompt(false);
            };

            useEffect(() => {
                const loadDictionary = async () => {
                    const savedVersion = localStorage.getItem(VERSION_KEY);
                    const savedData = localStorage.getItem(CACHE_KEY);
                    
                    if (savedData && savedVersion === VERSION) {
                        try {
                            const data = JSON.parse(savedData);
                            const normalized = normalizeData(data);
                            setLemmi(normalized);
                            setFiltered(normalized);
                            setLoading(false);
                            return;
                        } catch (error) {
                            localStorage.removeItem(CACHE_KEY);
                        }
                    }

                    try {
                        const response = await fetch('./sinonimi-master.json');
                        if (!response.ok) throw new Error('Fetch fallito');
                        const data = await response.json();
                        
                        if (!Array.isArray(data) || data.length === 0) throw new Error('JSON non valido');
                        
                        const normalized = normalizeData(data);
                        setLemmi(normalized);
                        setFiltered(normalized);
                        
                        try {
                            const jsonString = JSON.stringify(normalized);
                            if (jsonString.length < 4 * 1024 * 1024) {
                                localStorage.setItem(CACHE_KEY, jsonString);
                                localStorage.setItem(VERSION_KEY, VERSION);
                            }
                        } catch (quotaError) {
                            localStorage.removeItem(CACHE_KEY);
                            localStorage.removeItem(VERSION_KEY);
                        }
                    } catch (error) {
                        alert('Errore nel caricamento del dizionario. Controlla la connessione internet.');
                    }
                    setLoading(false);
                };
                loadDictionary();
            }, []);

            useEffect(() => {
                if (searchTerm) performSearch(searchTerm);
            }, [searchInSynonyms]);

            const ensureArray = (value) => {
                if (Array.isArray(value)) return value;
                if (typeof value === 'string') return value.split(',').map(s => s.trim()).filter(s => s);
                return [];
            };

            const normalizeData = (data) => {
                return data.map(entry => ({
                    ...entry,
                    sinonimi: ensureArray(entry.sinonimi),
                    contrari: ensureArray(entry.contrari)
                }));
            };

            const parseHTMLFiles = async (files) => {
                setLoading(true);
                const allLemmi = [];
                for (const file of files) {
                    try {
                        const text = await file.text();
                        const parser = new DOMParser();
                        const doc = parser.parseFromString(text, 'text/html');
                        const rows = doc.querySelectorAll('table tr');
                        for (let i = 1; i < rows.length; i++) {
                            const cells = rows[i].querySelectorAll('td');
                            if (cells.length >= 3) {
                                const lemma = cells[0].textContent.trim();
                                const funzione = cells[1].textContent.trim();
                                const sinonimiText = cells[2].textContent.trim();
                                const parts = sinonimiText.split('CONTR.');
                                const sinonimi = parts[0].replace(/SIN\./g, '').split(',').map(s => s.trim()).filter(s => s && s.length > 0);
                                const contrari = parts[1] ? parts[1].split(',').map(s => s.trim()).filter(s => s && s.length > 0) : [];
                                if (lemma) allLemmi.push({ lemma, funzione, sinonimi, contrari });
                            }
                        }
                    } catch (error) {
                        console.error('Errore parsing ' + file.name + ':', error);
                    }
                }
                const normalized = normalizeData(allLemmi);
                setLemmi(normalized);
                setFiltered(normalized);
                setLoading(false);
                return normalized;
            };

            const handleJSONUpload = async (ev) => {
                const file = ev.target.files[0];
                if (!file) return;
                setLoading(true);
                try {
                    const text = await file.text();
                    const data = JSON.parse(text);
                    if (!Array.isArray(data) || data.length === 0) throw new Error('Il JSON deve essere un array non vuoto');
                    const normalized = normalizeData(data);
                    setLemmi(normalized);
                    setFiltered(normalized);
                    try {
                        const jsonString = JSON.stringify(normalized);
                        const sizeInMB = (jsonString.length / 1024 / 1024).toFixed(2);
                        if (jsonString.length < 4 * 1024 * 1024) {
                            localStorage.setItem(CACHE_KEY, jsonString);
                            localStorage.setItem(VERSION_KEY, VERSION);
                            alert('Dizionario caricato (' + sizeInMB + ' MB)! Salvato in cache locale.');
                        } else {
                            alert('Dizionario caricato (' + sizeInMB + ' MB)! Troppo grande per la cache.');
                        }
                    } catch (quotaError) {
                        alert('Dizionario caricato! Troppo grande per la cache.');
                    }
                } catch (error) {
                    alert('Errore nel caricamento del JSON: ' + error.message);
                }
                setLoading(false);
            };

            const handleHTMLUpload = async (ev) => {
                const files = Array.from(ev.target.files);
                if (files.length === 0) return;
                const normalized = await parseHTMLFiles(files);
                try {
                    const jsonString = JSON.stringify(normalized);
                    if (jsonString.length < 4 * 1024 * 1024) {
                        localStorage.setItem(CACHE_KEY, jsonString);
                        localStorage.setItem(VERSION_KEY, VERSION);
                    }
                } catch (quotaError) {}
            };

            const clearCache = () => {
                if (confirm('Vuoi davvero cancellare il dizionario salvato? Dovrai ricaricarlo.')) {
                    localStorage.removeItem(CACHE_KEY);
                    localStorage.removeItem(VERSION_KEY);
                    setLemmi([]);
                    setFiltered([]);
                    setSearchTerm('');
                    setCurrentSearchTerm('');
                    alert('Cache cancellata! Ricarica il dizionario.');
                }
            };

            const performSearch = useCallback((value) => {
                // FIX #3: reset contatore visibili ad ogni nuova ricerca
                setVisibleCount(100);
                
                if (!value.trim()) {
                    setFiltered(lemmi);
                    setCurrentSearchTerm('');
                    return;
                }

                const term = value.toLowerCase();
                const normalizedTerm = normalizeText(value);
                const startsWithWildcard = term.startsWith('*');
                const endsWithWildcard = term.endsWith('*');
                const cleanTerm = term.replace(/\*/g, '');
                const cleanNormalizedTerm = normalizedTerm.replace(/\*/g, '');

                const matchFunc = (text) => {
                    const lowerText = text.toLowerCase();
                    const normalizedTextVal = normalizeText(text);
                    
                    const checkMatch = (textToCheck, termToCheck) => {
                        if (startsWithWildcard && endsWithWildcard) return textToCheck.includes(termToCheck);
                        if (startsWithWildcard) return textToCheck.endsWith(termToCheck) || textToCheck.includes(' ' + termToCheck);
                        if (endsWithWildcard) return textToCheck.startsWith(termToCheck);
                        return textToCheck === termToCheck || textToCheck.startsWith(termToCheck + ' ');
                    };
                    
                    return checkMatch(lowerText, cleanTerm) || checkMatch(normalizedTextVal, cleanNormalizedTerm);
                };

                const results = lemmi.filter(entry => {
                    const lemmaMatch = matchFunc(entry.lemma);
                    if (searchInSynonyms) {
                        return lemmaMatch || entry.sinonimi.some(s => matchFunc(s)) || entry.contrari.some(c => matchFunc(c));
                    }
                    return lemmaMatch;
                });
                
                setFiltered(results);
                setCurrentSearchTerm(cleanTerm);
            }, [lemmi, searchInSynonyms]);

            const debouncedSearch = useDebounce(performSearch, 300);

            const handleSearch = (value) => {
                setSearchTerm(value);
                debouncedSearch(value);
            };

            const termMatches = (text) => {
                if (!currentSearchTerm) return false;
                return normalizeText(text).includes(normalizeText(currentSearchTerm));
            };

            const copyToClipboard = () => {
                navigator.clipboard.writeText(JSON.stringify(lemmi, null, 2)).then(() => {
                    alert('JSON copiato negli appunti!');
                }).catch(() => {
                    alert('Errore nella copia. Usa "Scarica JSON".');
                });
            };

            const downloadJSON = () => {
                const blob = new Blob([JSON.stringify(lemmi, null, 2)], { type: 'application/json' });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = 'sinonimi-master.json';
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
                URL.revokeObjectURL(url);
            };

            // --- RENDER ---

            // Loading state
            if (loading && lemmi.length === 0) {
                return e('div', { className: 'min-h-screen bg-gradient-to-br from-amber-50 via-orange-50 to-red-50' },
                    e('div', { className: 'max-w-6xl mx-auto p-6' },
                        renderHeader(),
                        e('div', { className: 'bg-white rounded-b-2xl shadow-lg p-8' },
                            e('div', { className: 'text-center py-12' },
                                e('div', { className: 'animate-spin rounded-full h-12 w-12 border-b-2 border-orange-600 mx-auto mb-4' }),
                                e('p', { className: 'text-gray-700' }, 'Caricamento dizionario...')
                            )
                        )
                    )
                );
            }

            // Empty state
            if (lemmi.length === 0) {
                return e('div', { className: 'min-h-screen bg-gradient-to-br from-amber-50 via-orange-50 to-red-50' },
                    e('div', { className: 'max-w-6xl mx-auto p-6' },
                        renderHeader(),
                        e('div', { className: 'bg-white rounded-b-2xl shadow-lg p-8' },
                            e('div', { className: 'text-center py-12' },
                                e(BookOpenIcon, { size: 64 }),
                                e('h2', { className: 'text-2xl font-bold text-gray-700 mb-4 mt-6' }, 'Dizionario dei Sinonimi'),
                                e('p', { className: 'text-gray-600 mb-8' }, 'Carica il dizionario per iniziare'),
                                e('div', { className: 'flex flex-col gap-4 max-w-md mx-auto' },
                                    e('button', { onClick: () => jsonInputRef.current?.click(), className: 'px-8 py-4 bg-gradient-to-r from-green-600 to-emerald-600 text-white rounded-lg hover:from-green-700 hover:to-emerald-700 transition flex items-center gap-3 justify-center text-lg font-semibold shadow-lg' },
                                        e(UploadIcon, { size: 24 }), 'Carica JSON (veloce)'
                                    ),
                                    e('button', { onClick: () => fileInputRef.current?.click(), className: 'px-6 py-3 bg-blue-600 text-white rounded-lg hover:bg-blue-700 transition flex items-center gap-2 justify-center' },
                                        e(UploadIcon, { size: 20 }), 'Carica file HTML (parsing completo)'
                                    )
                                ),
                                e('input', { ref: jsonInputRef, type: 'file', accept: '.json', onChange: handleJSONUpload, style: { display: 'none' } }),
                                e('input', { ref: fileInputRef, type: 'file', accept: '.htm,.html', multiple: true, onChange: handleHTMLUpload, style: { display: 'none' } }),
                                e('div', { className: 'mt-8 p-4 bg-blue-50 border border-blue-200 rounded-lg text-sm text-gray-700 max-w-xl mx-auto' },
                                    e('p', { className: 'font-semibold mb-2' }, 'Dove trovare il JSON?'),
                                    e('p', { className: 'mb-2' }, 'Scaricalo da GitHub:'),
                                    e('a', { href: 'https://github.com/Infingardo/sinonimi-dizionario/raw/main/sinonimi-master.json', target: '_blank', rel: 'noopener noreferrer', className: 'text-blue-600 hover:underline break-all' }, 'github.com/Infingardo/sinonimi-dizionario'),
                                    e('p', { className: 'mt-2 text-xs text-gray-600' }, 'Poi caricalo qui con "Carica JSON"')
                                )
                            )
                        ),
                        renderFooter()
                    )
                );
            }

            // Main view
            return e('div', { className: 'min-h-screen bg-gradient-to-br from-amber-50 via-orange-50 to-red-50' },
                e('div', { className: 'max-w-6xl mx-auto p-6' },
                    renderHeader(),
                    e('div', { className: 'bg-white rounded-b-2xl shadow-lg p-8' },
                        // Search bar
                        e('div', { className: 'mb-4 flex gap-3' },
                            e('div', { className: 'flex-1 relative' },
                                e('div', { className: 'absolute left-3 top-3.5 text-gray-400' }, e(SearchIcon)),
                                e('input', {
                                    type: 'text',
                                    placeholder: 'Cerca... (usa * per wildcard: mare* inizio, *mare fine, *mare* ovunque)',
                                    value: searchTerm,
                                    onChange: (ev) => handleSearch(ev.target.value),
                                    className: 'w-full pl-10 pr-4 py-3 border-2 border-gray-300 rounded-lg focus:border-orange-500 focus:outline-none'
                                })
                            ),
                            e('button', { onClick: () => setShowExport(true), className: 'px-4 py-3 bg-orange-600 text-white rounded-lg hover:bg-orange-700 transition flex items-center gap-2' },
                                e(DownloadIcon, { size: 20 }), 'Export'
                            ),
                            e('button', { onClick: clearCache, className: 'px-4 py-3 bg-red-600 text-white rounded-lg hover:bg-red-700 transition flex items-center gap-2', title: 'Cancella dizionario dalla cache locale' },
                                e(TrashIcon, { size: 20 })
                            )
                        ),
                        // Checkbox
                        e('div', { className: 'mb-6 flex items-center gap-2' },
                            e('input', { type: 'checkbox', id: 'searchInSynonyms', checked: searchInSynonyms, onChange: () => setSearchInSynonyms(!searchInSynonyms), className: 'w-4 h-4 text-orange-600 rounded focus:ring-orange-500' }),
                            e('label', { htmlFor: 'searchInSynonyms', className: 'text-sm text-gray-700 cursor-pointer select-none' }, 'Cerca anche nei sinonimi e contrari')
                        ),
                        // Stats
                        e('div', { className: 'bg-gradient-to-r from-amber-50 to-orange-50 rounded-lg p-4 mb-6 border border-amber-200' },
                            e('div', { className: 'flex gap-6 text-sm items-center flex-wrap' },
                                e('div', null,
                                    e('span', { className: 'text-gray-600' }, 'Lemmi totali: '),
                                    e('span', { className: 'font-bold text-gray-800' }, lemmi.length.toLocaleString())
                                ),
                                e('div', null,
                                    e('span', { className: 'text-gray-600' }, 'Risultati: '),
                                    e('span', { className: 'font-bold text-gray-800' }, filtered.length.toLocaleString())
                                ),
                                e('div', { className: 'ml-auto text-xs text-green-700 flex items-center gap-1' }, 'Versione ' + VERSION)
                            )
                        ),
                        // Results
                        e('div', { className: 'space-y-4 max-h-[600px] overflow-y-auto' },
                            filtered.length > 0 ?
                                filtered.slice(0, visibleCount).map((entry, idx) =>
                                    e('div', { key: idx, className: 'border border-gray-200 rounded-lg p-5 hover:shadow-md transition bg-gradient-to-r from-white to-amber-50' },
                                        e('div', { className: 'flex items-baseline gap-3 mb-3' },
                                            e('h3', { className: 'text-2xl font-bold text-gray-800' }, entry.lemma),
                                            entry.funzione && e('span', { className: 'text-sm px-3 py-1 bg-orange-100 text-orange-700 rounded-full font-medium' }, entry.funzione)
                                        ),
                                        entry.sinonimi && entry.sinonimi.length > 0 &&
                                            e('div', { className: 'mb-3' },
                                                e('span', { className: 'text-sm font-semibold text-gray-600 block mb-1' }, 'Sinonimi:'),
                                                e('div', { className: 'text-gray-700' },
                                                    entry.sinonimi.map((sin, i) => {
                                                        const isMatch = termMatches(sin);
                                                        return e('span', { key: i },
                                                            e('button', {
                                                                onClick: () => { setSearchTerm(sin); performSearch(sin); },
                                                                className: 'hover:text-orange-600 hover:underline cursor-pointer transition' + (isMatch ? ' font-semibold' : '')
                                                            }, highlightText(sin, currentSearchTerm, searchInSynonyms && isMatch)),
                                                            i < entry.sinonimi.length - 1 ? ', ' : ''
                                                        );
                                                    })
                                                )
                                            ),
                                        entry.contrari && entry.contrari.length > 0 &&
                                            e('div', null,
                                                e('span', { className: 'text-sm font-semibold text-gray-600 block mb-1' }, 'Contrari:'),
                                                e('div', { className: 'text-gray-600' },
                                                    entry.contrari.map((con, i) => {
                                                        const isMatch = termMatches(con);
                                                        return e('span', { key: i },
                                                            e('button', {
                                                                onClick: () => { setSearchTerm(con); performSearch(con); },
                                                                className: 'hover:text-orange-600 hover:underline cursor-pointer transition' + (isMatch ? ' font-semibold' : '')
                                                            }, highlightText(con, currentSearchTerm, searchInSynonyms && isMatch)),
                                                            i < entry.contrari.length - 1 ? ', ' : ''
                                                        );
                                                    })
                                                )
                                            )
                                    )
                                )
                            :
                                e('div', { className: 'text-center py-12' },
                                    e('p', { className: 'text-xl text-gray-500' }, 'Nessun risultato per "' + searchTerm + '"'),
                                    e('p', { className: 'text-sm text-gray-400 mt-2' }, 'Prova a cercare senza accenti (es: "perche" invece di "perché")')
                                ),
                            // FIX #3: Bottone "Carica altri"
                            filtered.length > visibleCount &&
                                e('div', { className: 'text-center py-4' },
                                    e('button', {
                                        onClick: () => setVisibleCount(visibleCount + 100),
                                        className: 'px-6 py-2 bg-amber-100 text-amber-800 rounded-lg hover:bg-amber-200 transition font-medium'
                                    }, 'Mostra altri 100 (', (visibleCount), ' di ', filtered.length.toLocaleString(), ')' )
                                )
                        )
                    ),
                    renderFooter(),
                    // Export modal
                    showExport && e('div', { className: 'fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center p-4 z-50' },
                        e('div', { className: 'bg-white rounded-lg shadow-xl p-6 max-w-2xl w-full' },
                            e('h2', { className: 'text-xl font-bold text-gray-800 mb-4' }, 'Esporta JSON'),
                            e('p', { className: 'text-gray-600 mb-4' }, 'Scarica il dizionario come file JSON o copialo negli appunti.'),
                            e('div', { className: 'flex gap-3 mb-4 flex-wrap' },
                                e('button', { onClick: downloadJSON, className: 'px-6 py-3 bg-gradient-to-r from-green-600 to-emerald-600 text-white rounded-lg hover:from-green-700 hover:to-emerald-700 transition flex items-center gap-2 font-semibold shadow-md' },
                                    e(DownloadIcon, { size: 20 }), 'Scarica JSON'
                                ),
                                e('button', { onClick: copyToClipboard, className: 'px-4 py-2 bg-blue-600 text-white rounded-lg hover:bg-blue-700 transition' }, 'Copia negli appunti'),
                                e('button', { onClick: () => setShowExport(false), className: 'px-4 py-2 bg-gray-200 text-gray-700 rounded-lg hover:bg-gray-300 transition' }, 'Chiudi')
                            ),
                            // FIX #4: usa jsonSizeMB memoizzato
                            e('div', { className: 'text-sm text-gray-500 bg-gray-50 p-3 rounded' },
                                e('div', { className: 'flex justify-between items-center' },
                                    e('span', null, 'Dimensione file:'),
                                    e('span', { className: 'font-mono font-semibold' }, jsonSizeMB + ' MB')
                                ),
                                e('div', { className: 'flex justify-between items-center mt-1' },
                                    e('span', null, 'Lemmi totali:'),
                                    e('span', { className: 'font-mono font-semibold' }, lemmi.length.toLocaleString())
                                )
                            )
                        )
                    ),
                    // Loading overlay
                    loading && lemmi.length > 0 && e('div', { className: 'fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50' },
                        e('div', { className: 'bg-white rounded-lg p-8' },
                            e('div', { className: 'animate-spin rounded-full h-12 w-12 border-b-2 border-orange-600 mx-auto mb-4' }),
                            e('p', { className: 'text-gray-700' }, 'Caricamento in corso...')
                        )
                    ),
                    // Install prompt
                    showInstallPrompt && e('div', { className: 'install-prompt' },
                        e('div', { className: 'flex items-center gap-4' },
                            e('div', null,
                                e('p', { className: 'font-bold text-lg mb-1' }, "Installa l'app!"),
                                e('p', { className: 'text-sm text-green-100' }, 'Aggiungi alla home screen per un accesso rapido')
                            ),
                            e('div', { className: 'flex gap-2' },
                                e('button', { onClick: handleInstallClick, className: 'px-4 py-2 bg-white text-green-700 rounded-lg font-semibold hover:bg-green-50 transition' }, 'Installa'),
                                e('button', { onClick: () => setShowInstallPrompt(false), className: 'px-4 py-2 bg-green-800 text-white rounded-lg hover:bg-green-900 transition' }, 'Dopo')
                            )
                        )
                    )
                )
            );
        }

        function renderHeader() {
            return e('div', { className: 'bg-gradient-to-r from-amber-600 to-orange-600 rounded-t-2xl shadow-lg p-8 text-white' },
                e('div', { className: 'flex items-center justify-center gap-3 mb-2' },
                    e(BookOpenIcon, { size: 40 }),
                    e('h1', { className: 'text-4xl font-bold' }, 'Dizionario dei Sinonimi')
                ),
                e('p', { className: 'text-center text-amber-100' }, 'Edizione vintage restaurata digitalmente')
            );
        }

        function renderFooter() {
            return e('div', { className: 'mt-6 text-center text-sm text-gray-500' },
                e('p', null,
                    'Dati derivati da ',
                    e('a', { href: 'https://www.homolaicus.com/linguaggi/sinonimi/', target: '_blank', rel: 'noopener noreferrer', className: 'text-amber-700 hover:underline' }, 'Homolaicus - Dizionario dei Sinonimi'),
                    ' (Enrico Galavotti)'
                ),
                e('p', { className: 'text-xs text-gray-400 mt-1' },
                    'Licenza CC-BY 4.0 • Interfaccia web: ',
                    e('a', { href: 'https://github.com/Infingardo', target: '_blank', rel: 'noopener noreferrer', className: 'hover:underline' }, 'Infingardo')
                )
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(e(SinonimiApp));
    }

    // Attende che React e ReactDOM siano disponibili
    (function waitForReact() {
        if (typeof React !== 'undefined' && typeof ReactDOM !== 'undefined') {
            initApp();
        } else {
            setTimeout(waitForReact, 50);
        }
    })();
    </script>
</body>
</html>
